spring:
  application:
    name: ziyayev-olzhas-student-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ziyayev_students}
    username: ${DB_USERNAME:ziyayev_olzhas}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
server:
  port: 8080
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  info:
    env:
      enabled: true
info:
  student:
    name: Ziyayev Olzhas
    group: IT2-2302
    github: https://github.com/olzhsz
